# Public benchmark task 1 pilot; adapted from Terminal-Bench heterogeneous-dates.
id: public-terminal-heterogeneous-dates
description: "Terminal-Bench heterogeneous-dates adaptation: use daily_temp_sf_high.csv and daily_temp_sf_low.csv to calculate the average daily high-minus-low temperature difference, then write only that number to avg_temp.txt."
required_contexts:
  - role: driver
    platform: linux
    tools: ["codex"]
  - role: server
    platform: linux
    tools: ["python3", "sh"]
allowed_contexts: ["*"]
inputs:
  read_artifacts:
    - kind: csv
      path: fixtures/task-deps/daily_temp_sf_high.csv
    - kind: csv
      path: fixtures/task-deps/daily_temp_sf_low.csv
outputs:
  write_targets:
    - kind: result
      path: ${workspace}/avg_temp.txt
success_oracle: ./oracle.sh
recovery_hint: "avg_temp.txt must contain only a numeric value computed from overlapping normalized dates in the two CSV files."
timeout_seconds: 900
